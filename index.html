<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px system-ui, sans-serif; color: #fff; background: #151923;
    }
    main { text-align: center; padding: 24px; }
    h1 { margin: 0 0 8px; }
    #balance { font-size: 2rem; font-weight: 700; margin: 20px; }
    #coin {
      width: 190px; height: 190px; border: 0; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe98a, #f6ad24 65%, #bb7410);
      box-shadow: 0 10px 0 #8f5b12, 0 16px 30px #0008;
      color: #7b4b08; font-size: 5rem; cursor: pointer;
      transition: transform .08s;
    }
    #coin:active { transform: scale(.94) translateY(4px); }
    p { color: #b9c0cf; }
  </style>
</head>
<body>
  <main>
    <h1>🪙 Coin Tap</h1>
    <p>Tap the coin to collect coins!</p>
    <div id="balance">0 coins</div>
    <button id="coin" aria-label="Tap to earn a coin">₿</button>
    <p>Each tap earns 1 coin</p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const balanceEl = document.getElementById("balance");
    const coin = document.getElementById("coin");
    let balance = Number(localStorage.getItem("coinBalance") || 0);

    function render() {
      balanceEl.textContent = `${balance.toLocaleString()} coins`;
    }

    coin.addEventListener("click", () => {
      balance += 1;
      localStorage.setItem("coinBalance", balance);
      render();
      tg?.HapticFeedback?.impactOccurred("light");
    });

    render();
  </script>
</body>
</html>
