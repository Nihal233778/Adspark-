<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Tap</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Existing Adspark SDK -->
  <script src="https://adspark-tma.top/api/public/sdk.js?k=50"></script>
  <!-- NEW: LiteBits Ads SDK -->
  <script src="https://ads.litebits.io/sdk/v1.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px system-ui, sans-serif;
      color: #fff;
      background: #151923;
    }
    main { text-align: center; padding: 24px; }
    h1 { margin: 0 0 8px; }
    #balance { font-size: 2rem; font-weight: 700; margin: 20px; }
    #coin {
      width: 190px;
      height: 190px;
      border: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe98a, #f6ad24 65%, #bb7410);
      box-shadow: 0 10px 0 #8f5b12, 0 16px 30px #0008;
      color: #7b4b08;
      font-size: 5rem;
      cursor: pointer;
      transition: transform .08s;
    }
    #coin:active { transform: scale(.94) translateY(4px); }
    .ad-button {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 12px auto;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #5865f2;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .ad-button:disabled { opacity: .6; cursor: wait; }
    /* Style for the new LiteBits button */
    .litebits-button { background: #f6ad24; color: #7b4b08; }
    #status { min-height: 24px; color: #b9c0cf; }
    p { color: #b9c0cf; }
  </style>
</head>
<body>
  <main>
    <h1>🪙 Coin Tap</h1>
    <p>Tap the coin to collect coins!</p>
    <div id="balance">0 coins</div>

    <button id="coin" aria-label="Tap to earn a coin">₿</button>
    <p>Each tap earns 1 coin</p>

    <button id="watch" class="ad-button">Watch ad for 10 coins</button>
    <button id="bonus" class="ad-button">Watch popup ad for 10 coins</button>
    <!-- NEW: LiteBits Button -->
    <button id="watch-litebits" class="ad-button litebits-button">Watch LiteBits Ad for 10 coins</button>
    
    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const userId = tg?.initDataUnsafe?.user?.id;
    const REWARD = 10;

    const balanceEl = document.getElementById("balance");
    const coin = document.getElementById("coin");
    const statusEl = document.getElementById("status");
    const litebitsBtn = document.getElementById("watch-litebits");

    let balance = Number(localStorage.getItem("coinBalance") || 0);
    let litebitsRewardPending = false;

    function render() {
      balanceEl.textContent = `${balance.toLocaleString()} coins`;
    }

    function addCoins(amount) {
      balance += amount;
      localStorage.setItem("coinBalance", String(balance));
      render();
    }

    coin.addEventListener("click", () => {
      addCoins(1);
      tg?.HapticFeedback?.impactOccurred("light");
    });

    // --- Existing Adspark Logic ---
    async function watchAd(button, adFunction) {
      if (typeof adFunction !== "function") {
        statusEl.textContent = "Ad service is unavailable. Please try again later.";
        return;
      }

      button.disabled = true;
      statusEl.textContent = "Loading ad…";

      try {
        await adFunction({ ymid: userId });
        addCoins(REWARD);
        statusEl.textContent = `Ad completed! You earned ${REWARD} coins.`;
        tg?.HapticFeedback?.notificationOccurred("success");
      } catch {
        statusEl.textContent = "No ad is available right now. Try again later.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("watch").addEventListener("click", (event) => {
      watchAd(event.currentTarget, window.showAdspark);
    });

    document.getElementById("bonus").addEventListener("click", (event) => {
      watchAd(event.currentTarget, window.showAdsparkPopup);
    });

    // --- NEW: LiteBits Ads Logic ---
    const ads = new LiteBitsAds({
      apiKey: 'lba_3478...', // ⚠️ REPLACE THIS WITH YOUR FULL API KEY
      placementId: '5f1de00d-72c5-427b-b8b1-c72cb50ef63f',
      baseUrl: 'https://ads.litebits.io',
      sandbox: true, // Remove this when you are ready to go live!
    });

    // Handle successful LiteBits ad view
    ads.on('rewarded', (r) => {
      console.log('LiteBits verified', r);
      if (litebitsRewardPending) {
        addCoins(REWARD);
        statusEl.textContent = `LiteBits Ad completed! You earned ${REWARD} coins.`;
        tg?.HapticFeedback?.notificationOccurred("success");
        litebitsRewardPending = false;
      }
      litebitsBtn.disabled = false;
    });

    // Handle no ads available (Fallback logic)
    ads.on('nofill', () => {
      statusEl.textContent = "No LiteBits ad is available right now. Try again later.";
      litebitsBtn.disabled = false;
      litebitsRewardPending = false;
    });

    // Trigger LiteBits Ad on button click
    litebitsBtn.addEventListener("click", async () => {
      litebitsBtn.disabled = true;
      statusEl.textContent = "Loading LiteBits ad…";
      litebitsRewardPending = true;
      
      try {
        await ads.show();
        // Note: The 'rewarded' event listener above will handle adding the coins.
      } catch (error) {
        console.error("LiteBits ad error:", error);
        statusEl.textContent = "Failed to load LiteBits ad. Try again.";
        litebitsBtn.disabled = false;
        litebitsRewardPending = false;
      }
    });

    render();
  </script>
</body>
</html>
